services:
  aiodarts:
    image: ghcr.io/pearmannick-prog/aio-darts/aio-darts-web:latest
    container_name: aiodarts
    build: . # Only used by `docker compose up --build`; ignored by a normal `up`
    restart: unless-stopped
    environment:
      - PORT=8080 # Port the app listens on inside the container
      - DATA_DIR=/data # Where persistent data is written (matches the volume below)
      - SIGNALING_PATH=/signaling # URL path the signaling WebSocket is served on
      - STUN_URLS=stun:stun.l.google.com:19302 # Comma-separated STUN servers for NAT traversal
      # - TURN_URL=turn:turn.example.com:3478 # Optional relay for players who can't connect peer-to-peer
      # - TURN_USERNAME=aiodarts # Username for the TURN server above
      # - TURN_CREDENTIAL=change-me # Password for the TURN server above
      # - SIGNALING_URL=wss://example.com/signaling # Only to point players at a DIFFERENT signaling server; leave unset for same-origin
    volumes:
      - /mnt/user/appdata/aiodarts:/data # Persistent data - the accounts and statistics SQLite database. Losing this volume deletes every account.
    ports:
      - 8887:8080 # host:container - the reverse proxy points at 8887
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
