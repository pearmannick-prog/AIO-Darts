# Runs AIO Darts using the pre-built images published by GitHub Actions to
# GHCR - no build step, no source needed, just:
#   docker compose up
#
# Set SIGNALING_URL below to your own deployment's address once and players
# never have to type a signaling server URL in manually - the web-darts
# container writes it into a config.json at startup that the page fetches
# automatically (see docker-entrypoint-config.sh). It's still editable per
# player from a collapsed "Signaling settings" section in the Online
# Challenge tab, for local testing or overriding the default.
#
# If these are your first images and you want anyone to be able to run this
# without logging in to GHCR first, make both packages public: on GitHub,
# go to your profile -> Packages -> select the package -> Package settings
# -> Change visibility -> Public. Until then, `docker compose up` will fail
# with an auth/pull error for anyone who hasn't run
# `docker login ghcr.io` with access to the packages.
#
# No bind mounts (yet): neither service writes anything to disk server-side
# right now. The signaling server's challenge rooms are intentionally
# in-memory/ephemeral by design (see signaling-server/server.js) - losing
# them on restart is expected, not a bug, since a challenge code is only
# meant to live for the few seconds it takes two players to connect. The
# web service is just static files. This will change once accounts/
# stat-tracking are built - that'll need a real database and a bind-mounted
# (or named volume) data directory, added at that point.

services:
  web-darts:
    image: ghcr.io/pearmannick-prog/aio-darts/aio-darts-web:latest
    ports:
      - "8887:80"
    environment:
      # Players' browsers connect to this directly - it can't be a Docker
      # container name (e.g. "signaling-darts"), since that only resolves
      # inside Docker's internal network, not from someone's own browser.
      #
      # Routed through its own subdomain in the reverse proxy (NGINX Proxy
      # Manager: a separate Proxy Host for signaling.aiodarts.spazcat.com,
      # forwarding to 192.168.0.69:8886, with "Websockets Support" turned
      # on) rather than a path on the main domain - subdomain routing is
      # the simplest case for most proxies to get right, no custom
      # location/path rewriting needed.
      - SIGNALING_URL=wss://signaling.aiodarts.spazcat.com

  signaling-darts:
    image: ghcr.io/pearmannick-prog/aio-darts/aio-darts-signaling:latest
    ports:
      - "8886:8080"
