name: Build Android APK

# Builds a debug APK on GitHub's runners and uploads it as a downloadable
# artifact - no Android Studio needed locally.
#
# This is the local-only build: manual entry and local pass-and-play, which
# are entirely client-side. Bluetooth and online play are deliberately not
# wired up here yet.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "*.js"
      - "index.html"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Assembles the front-end into www/ by copying the repo root and then
      # removing infrastructure that has no place in an APK. Exclusion-based
      # on purpose: a new front-end file added at the root is picked up
      # automatically instead of silently missing until someone remembers to
      # update a list here.
      - name: Assemble web assets
        run: |
          rm -rf www
          mkdir -p www
          rsync -a ./ www/ \
            --exclude www \
            --exclude .git \
            --exclude .github \
            --exclude server \
            --exclude android \
            --exclude node \
            --exclude node_modules \
            --exclude Dockerfile \
            --exclude .dockerignore \
            --exclude docker-compose.yml \
            --exclude README.md \
            --exclude 'capacitor.config.json' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '*.bat'
          echo "--- www contents ---"
          ls -la www

      # Fails loudly here rather than shipping an APK with a blank screen.
      - name: Verify web assets
        run: |
          test -f www/index.html || { echo "www/index.html missing"; exit 1; }
          for f in game.js online.js dartboard.js granboard.js scoring.js quickentry.js version.js webrtc.js; do
            test -f "www/$f" || { echo "www/$f missing"; exit 1; }
          done
          echo "All expected front-end files present."

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aio-darts-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
