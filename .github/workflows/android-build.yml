name: Build Android APK

# Builds a debug APK on GitHub's runners and uploads it as a downloadable
# artifact - no Android Studio needed locally.
#
# This is the local-only build: manual entry, the clickable dartboard, and
# local pass-and-play, which are entirely client-side. Bluetooth and online
# play are deliberately not wired up here yet.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "*.js"
      - "index.html"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # Capacitor 8's CLI declares engines.node >= 22 - Node 20 fails here.
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Capacitor 8 generates a project targeting compileSdk 36, which is newer
      # than what the runner image ships with. This installs the missing SDK
      # packages and accepts the licenses, so Gradle doesn't fail partway
      # through trying to resolve the platform itself.
      - uses: android-actions/setup-android@v4

      # Assembles the front-end into www/ by copying the repo and pruning
      # infrastructure that has no place in an APK. Exclusion-based on
      # purpose: a new front-end file added at the root is picked up
      # automatically instead of silently missing until someone remembers to
      # update a list here.
      #
      # Uses tar rather than rsync - rsync is no longer present on the
      # ubuntu-24.04 runner image that ubuntu-latest now points to.
      - name: Assemble web assets
        run: |
          rm -rf www
          mkdir -p www
          tar -cf - \
            --exclude=./www \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./server \
            --exclude=./android \
            --exclude=./node \
            --exclude=./node_modules \
            --exclude=./Dockerfile \
            --exclude=./.dockerignore \
            --exclude=./docker-compose.yml \
            --exclude=./README.md \
            --exclude=./capacitor.config.json \
            --exclude=./package.json \
            --exclude=./package-lock.json \
            --exclude='./*.bat' \
            . | tar -xf - -C www
          echo "--- www contents ---"
          ls -la www

      # Fails loudly here rather than shipping an APK that opens to a blank
      # screen. A missing file at this point is nearly always a filename typo.
      - name: Verify web assets
        run: |
          FAIL=0
          test -f www/index.html || { echo "MISSING: www/index.html"; FAIL=1; }
          # Every front-end module, in the same grouping sw.js uses - these two
          # hand-maintained lists are the exceptions to this repo's
          # exclusion-based approach, and they drift for the same reason, so
          # they are worth keeping legible and worth checking together.
          for f in game.js online.js accountui.js lobbyui.js version.js \
                   prefs.js theme.js customize.js ocheview.js checkout.js checkouthint.js audio.js \
                   accountstore.js lobbyclient.js matchrecorder.js charts.js statsengine.js \
                   granboard.js boardlink.js dartnotation.js scorerlink.js webrtc.js \
                   scoring.js cricket.js countup.js bermuda.js medley.js teams.js rating.js botplayer.js \
                   dartboard.js cricketboard.js quickentry.js medleybuilder.js \
                   stats/x01stats.js stats/cricketstats.js stats/countupstats.js stats/bermudastats.js; do
            test -f "www/$f" || { echo "MISSING: www/$f"; FAIL=1; }
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "Front-end files missing from www/ - check for filename typos at the repo root."
            exit 1
          fi
          echo "All expected front-end files present."

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: aio-darts-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
