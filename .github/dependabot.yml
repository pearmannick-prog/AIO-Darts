# dependabot.yml - dependency update PRs.
#
# NOTE: this file only takes effect once it is on the DEFAULT branch. Dependabot
# reads its config from main and nowhere else, so until this is merged the
# scheduled update PRs below do not run. The security half - vulnerability
# alerts and automatic fix PRs for known CVEs - is a repository setting rather
# than a file, and is already switched on, so the part that actually matters is
# working now.
#
# There are three separate dependency sets here and they are genuinely
# different things, which is why each gets its own entry rather than one
# catch-all:

version: 2
updates:
  # The server. One production dependency, `ws`, which carries the signaling
  # relay and the lobby - so an advisory against it matters more here than the
  # size of the dependency suggests.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(server)"

  # The Capacitor toolchain at the repo root, which only builds the Android
  # APK. Nothing here is served to a browser or run on the server, so these are
  # grouped into a single PR rather than arriving one at a time - the review
  # question is "does the APK still build", and that is one question.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(android)"
    groups:
      capacitor:
        patterns: ["*"]

  # The Windows desktop build. A separate entry from the Capacitor one above,
  # even though both are npm at a path, because the review question is not the
  # same. The APK's toolchain never runs on anyone's machine; Electron is a
  # whole browser engine that does, and an advisory against it is an advisory
  # against something PEOPLE HAVE INSTALLED. A server is fixed by redeploying
  # it. An installed app is fixed only if a release goes out and the updater
  # reaches it, which is a longer road and a reason to see these promptly -
  # hence weekly rather than monthly.
  #
  # Deliberately NOT grouped the way Capacitor is. `electron` gets its own PR:
  # it carries the Chromium version and therefore the security surface, and its
  # majors have already broken things this app depends on - the whole
  # select-bluetooth-device contract lives on that boundary, and reading one
  # changelog carefully is the point. The packaging pair IS grouped, because
  # "does it still produce an installer that updates" is genuinely one question.
  #
  # Note this entry is NOT what protects against a known CVE. Security alerts
  # and their automatic fix PRs are a repository setting, not this file, and
  # they already scan every manifest in the repo including this one - a desktop
  # Electron advisory opened a PR here before this entry existed. What this adds
  # is the ROUTINE half: staying current so that the next security bump is a
  # patch rather than a major.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(desktop)"
    groups:
      electron-packaging:
        patterns:
          - "electron-builder"
          - "electron-updater"

  # The GitHub Actions themselves. Easy to forget because they are not in any
  # package.json, and a compromised or abandoned action runs with access to the
  # build - which for this repo means the image that gets published.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
