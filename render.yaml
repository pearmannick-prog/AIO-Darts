# render.yaml - Render Blueprint for the deployment at aiodarts.com (the custom
# domain in front of the Render service below; aio-darts.onrender.com still
# answers on the same service).
#
# What this is for: everything else about this project lives in the repo, and
# without this file the deployment's settings live only in Render's dashboard -
# so "how is this deployed?" is a question the repo cannot answer, and a
# service that gets deleted or recreated has to be reassembled from memory.
#
# IMPORTANT: adding this file does not change an already-existing service.
# Render only reads a blueprint for services created FROM one (New > Blueprint).
# An existing web service keeps using its dashboard settings and ignores this
# entirely. It is therefore documentation now, and a one-click rebuild later -
# which is precisely when you'd want it and precisely when nobody remembers
# what the settings were.
#
# Deploys happen on push to main, which is Render's default for a blueprint
# service and matches how this is actually used.

services:
  - type: web
    name: aio-darts
    runtime: docker
    # The root Dockerfile, which copies the whole repo - see the note in it
    # about why the file list is exclusion-based.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Matches the service this replaces. Worth getting right at creation time:
    # a service cannot be moved between regions afterwards, it has to be
    # recreated, which is the whole exercise again.
    region: virginia
    branch: main

    # Hits the server's cheap liveness probe, which touches no filesystem and
    # no dependencies, so it answers even when something else is wrong.
    healthCheckPath: /healthz

    envVars:
      # PORT is deliberately absent. Render injects it, and a runtime env var
      # beats the Dockerfile's `ENV PORT=8080` default, so setting it here
      # would only create a second place to get it wrong.
      #
      # GIT_SHA is also absent, on purpose: Render sets RENDER_GIT_COMMIT
      # automatically and buildVersion() in server/server.js already reads it.
      # That is what stops the footer reporting "build dev" on this deployment.

      # STUN lets each browser discover its own public address so the two can
      # try to connect directly. This is the default the server would use
      # anyway; it's stated here so the deployment's networking is visible in
      # the repo rather than implied.
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302

      # TURN relays traffic for the ~10-20% of players whose networks refuse
      # direct P2P. This deployment HAS it, via Cloudflare Realtime rather than
      # a relay of its own - which is why the static TURN_URL/TURN_USERNAME/
      # TURN_CREDENTIAL trio below stays commented out and these two are set
      # instead. Cloudflare does not issue long-lived credentials: the server
      # holds the key and the API token and mints a short-lived credential per
      # session, so the token never leaves the server and only the minted
      # credential reaches a browser. That is why it cannot be expressed as a
      # username and password pair. See the block comment in server/server.js.
      #
      # It costs bandwidth on whoever hosts the relay, and with camera and mic
      # switched on a relayed match is a video call's worth of traffic - read
      # the README section on TURN before assuming this is free.
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false

      # The static alternative, for a relay you run yourself. Mutually
      # exclusive with the pair above in practice, not in code.
      # - key: TURN_URL
      #   value: turn:turn.example.com:3478
      # - key: TURN_USERNAME
      #   sync: false
      # - key: TURN_CREDENTIAL
      #   sync: false

      # Password reset mail. With all three set, server/email.js posts the reset
      # link to Resend; with any of them missing it LOGS the link instead, which
      # is a working mode rather than a broken one - it is what lets a
      # self-hosted box do password resets on day one. Production has all three,
      # so resets here actually send.
      #
      # PUBLIC_URL is also what makes the link in that mail point at the right
      # host: it must be the address players actually use (https://aiodarts.com),
      # not the onrender.com one.
      - key: PUBLIC_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_KEY
        sync: false

      # ---------------------------------------------------------------------
      # PERSISTENCE - production carries real accounts, and this is what keeps
      # them.
      # ---------------------------------------------------------------------
      # Accounts, match history, statistics and leaderboards live in a SQLite
      # file in DATA_DIR. Render's free tier has an EPHEMERAL filesystem: it is
      # wiped on every deploy AND on every spin-down after ~15 minutes idle.
      # With nothing else in place this app would therefore delete every account
      # several times a day and do it SILENTLY, because a fresh empty database
      # is indistinguishable from a working one - it opens fine and reports
      # accounts:true on /healthz - until someone tries to sign in.
      #
      # Litestream is what closes that: it replicates the file to R2 and
      # restores it on boot, so the ephemeral disk stops mattering. See
      # litestream.yml and docker-entrypoint.sh. That makes these five
      # variables load-bearing on this service - unset R2_BUCKET and the
      # entrypoint quietly exec's node directly and the silent wipe is back.
      #
      # The one check that tells you which state a deploy is in is the first
      # line of its log: `replication : R2 bucket …` or `replication : off`.
      #
      # sync: false because they are credentials - Render prompts for them and
      # never reads them from this file. R2_PATH is not secret but is listed
      # the same way to keep the five together, and because production and the
      # test build MUST NOT share a prefix: same bucket, different paths, or
      # each will restore and then overwrite the other's database.
      - key: R2_BUCKET
        sync: false
      - key: R2_PATH
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

    # A disk is the OTHER way to solve this, and the two are not exclusive -
    # a disk makes the local file durable, Litestream makes it recoverable
    # after the machine itself is gone, and only the second also protects
    # against a bad DELETE (see the snapshot note in litestream.yml). To attach
    # one, move to a paid instance type and uncomment:
    #
    #   disk:
    #     name: aio-darts-data
    #     mountPath: /app/data     # matches DATA_DIR in the Dockerfile
    #     sizeGB: 1                # a match is a few KB; 1GB is years of play
    #
    # Left commented rather than enabled because uncommenting it changes what
    # the deployment costs, and that is the operator's decision to make
    # deliberately rather than to discover on a bill.

  # ---------------------------------------------------------------------------
  # The testing deployment
  # ---------------------------------------------------------------------------
  # A second service running the accounts/statistics branch, so that work can be
  # tried on real hardware - a phone needs HTTPS for Web Bluetooth and for the
  # PWA to install, which a LAN address cannot give it - WITHOUT any of it
  # reaching aio-darts.onrender.com.
  #
  # IMPORTANT: like the service above, this is documentation unless the services
  # were created FROM this blueprint. The production service was created by hand
  # in the dashboard, so it does not read this file, and pointing a blueprint at
  # this repo now would try to adopt or recreate it. Create this second service
  # by hand too: New > Web Service, same repo, branch below, Docker runtime.
  #
  # WHAT FREE TIER MEANS HERE, precisely - it is not just "wiped on deploy":
  # a free service also spins down after about 15 minutes of inactivity and
  # restarts on the next request, and the filesystem resets each time. The first
  # request after a spin-down still waits ~50s for a cold start.
  #
  # The data no longer goes with it. Litestream replicates the database to R2
  # and restores it on boot, so an account survives a deploy and a spin-down -
  # tested by wiping the disk and finding the session still valid. This depends
  # entirely on the R2_* variables being set; unset them and every reset is
  # silent again.
  #
  # To promote this to a real staging environment later: change plan to a paid
  # instance type and attach a disk at /app/data, exactly as described above.
  - type: web
    name: aio-darts-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: virginia

    # The only line that really distinguishes this service from production.
    # Render deploys one branch per service, which is what keeps the two apart:
    # pushing this branch cannot deploy the production service, and merging to
    # main cannot deploy this one.
    branch: accounts-stats

    healthCheckPath: /healthz

    envVars:
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302

      # The shared password wall. Set this in the dashboard rather than here -
      # a password committed to a public repo is not a password - which is what
      # sync: false means: Render prompts for the value and never reads it from
      # this file.
      #
      # With it set, every page, every API call and both WebSockets need the
      # password; /healthz stays open so Render's health check still passes.
      # Production leaves it UNSET, which disables the gate entirely.
      - key: SITE_PASSWORD
        sync: false

      # The same five as production, and the reason they are listed again
      # rather than shared: R2_PATH must DIFFER between the two services. One
      # bucket is fine, one prefix is not - two deployments replicating to the
      # same path each restore the other's database on boot and then overwrite
      # it, which loses both. Everything else about them is identical.
      - key: R2_BUCKET
        sync: false
      - key: R2_PATH
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # No TURN here on purpose: a relayed match with video is a video call's
      # worth of bandwidth, and a test deployment is not where to spend it.
