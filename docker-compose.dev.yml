# FOR DEVELOPMENT ONLY - builds the images from the source in this repo.
# If you just want to run AIO Darts, use `docker-compose.yml` instead, which
# pulls the pre-built images from GHCR and doesn't build anything.
#
# Use this file when you're actually changing the code and want to test
# your changes:
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:8000 - the signaling URL is pre-filled
# automatically from SIGNALING_URL below, no manual entry needed.
#
# Service names match docker-compose.yml (web-darts / signaling-darts)
# for consistency between the two files, even though naming collisions
# aren't really a concern for a local one-off dev build.

services:
  web-darts:
    build: .
    ports:
      - "8000:80"
    environment:
      - SIGNALING_URL=ws://localhost:8080

  signaling-darts:
    build: ./signaling-server
    ports:
      - "8080:8080"
