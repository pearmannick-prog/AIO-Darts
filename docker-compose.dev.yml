# FOR DEVELOPMENT ONLY - builds the image from the source in this repo.
# If you just want to run AIO Darts, use `docker-compose.yml` instead, which
# pulls the pre-built image from GHCR and doesn't build anything.
#
# Use this file when you're actually changing the code and want to test:
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:8000 and open a second tab to the same address
# to play yourself. There's nothing to configure - the signaling server is
# part of this same container on this same port, so the front-end finds it
# automatically.

services:
  darts:
    build: .
    ports:
      - "8000:8080"
